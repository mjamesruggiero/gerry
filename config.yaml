# Non-secret configuration. Secrets live in .env / Fly secrets.

s3:
  bucket: mr-gerry-media
  region: us-west-1
  upload_prefix: uploads/
  gallery_prefix: galleries/
  signed_url_ttl_seconds: 604800   # 7 days

prefilter:
  # Perceptual-hash distance below which two frames are "near duplicates".
  phash_distance: 8
  # Variance-of-Laplacian below this is flagged as blurry.
  blur_threshold: 100.0
  # Fraction of pixels at the extremes before a frame is flagged.
  clipped_fraction: 0.25

scoring:
  provider: claude
  model: claude-sonnet-4-5
  prompt_version: cull_v4
  max_retries: 3

  # The model ranks; we choose the cut. Set from a threshold sweep against
  # the 349-frame golden set -- see ADR 0003/0004.
  #   threshold 83 -> precision 0.842, recall 0.115  (shipping: "best picks")
  #   threshold 43 -> precision 0.533, recall 0.755  (broad net, not shipped)
  keep_threshold: 83

eval:
  # Set from measured performance, not aspiration (ADR 0004).
  # Baseline at the shipping threshold: AUC 0.657, precision 0.842.
  min_auc: 0.60              # 0.5 is chance; primary, threshold-independent
  max_auc_drop: 0.05         # catches a slow slide against baseline
  min_keep_precision: 0.75   # at the shipping threshold, not raw verdicts
  max_cost_increase_pct: 20
