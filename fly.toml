# Fly.io config for Gerry.
# Deploy:  fly deploy --build-arg GIT_SHA=$(git rev-parse --short HEAD)

app = "gerry-cull"
primary_region = "sjc"          # San Jose - closest to the Bay Area

[build]

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # Machines idle down; pay only for use
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
