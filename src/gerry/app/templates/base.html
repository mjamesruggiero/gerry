<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Gerry{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
<style>
 :root { --bg:#09090b; --fg:#e4e4e7; --mut:#71717a; --line:#27272a;
         --keep:#22c55e; --maybe:#eab308; --rej:#ef4444; }
 * { box-sizing:border-box; }
 body { margin:0; background:var(--bg); color:var(--fg); line-height:1.5;
        font-family:-apple-system,system-ui,sans-serif; }
 header { border-bottom:1px solid var(--line); padding:.8rem 1.2rem;
          display:flex; gap:1.2rem; align-items:baseline; }
 header a { color:var(--fg); text-decoration:none; font-weight:600; }
 header nav a { color:var(--mut); font-weight:400; font-size:.9rem; margin-right:1rem; }
 main { max-width:1200px; margin:0 auto; padding:1.5rem 1.2rem 4rem; }
 h1 { font-size:1.4rem; margin:0 0 .3rem; } h2 { font-size:1.05rem; margin:2rem 0 .8rem; }
 .mut { color:var(--mut); font-size:.85rem; }
 table { width:100%; border-collapse:collapse; font-size:.9rem; }
 th,td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); }
 th { color:var(--mut); font-weight:500; font-size:.8rem; text-transform:uppercase; }
 .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
 .card { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#111113; }
 .card img { width:100%; aspect-ratio:3/2; object-fit:cover; display:block; background:#000; }
 .card .body { padding:.6rem .7rem; }
 .pill { display:inline-block; padding:.1rem .45rem; border-radius:3px;
         font-size:.72rem; font-weight:600; }
 .keep{background:rgba(34,197,94,.15);color:var(--keep)}
 .maybe{background:rgba(234,179,8,.15);color:var(--maybe)}
 .reject{background:rgba(239,68,68,.15);color:var(--rej)}
 .unscored{background:rgba(113,113,122,.2);color:var(--mut)}
 button { background:#1c1c1f; color:var(--fg); border:1px solid var(--line);
          border-radius:4px; padding:.25rem .55rem; font-size:.78rem; cursor:pointer; }
 button:hover { background:#27272a; }
 button.on { border-color:currentColor; }
 .stat { display:inline-block; margin-right:2rem; }
 .stat b { display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; }
 form.up { border:1px dashed var(--line); border-radius:6px; padding:1.2rem; }
 input,select { background:#111113; color:var(--fg); border:1px solid var(--line);
                border-radius:4px; padding:.4rem .5rem; font-size:.9rem; }
 .dup { outline:1px solid #3b82f6; }
 .panel { border:1px solid var(--line); border-radius:6px; padding:.9rem 1rem;
          margin:1rem 0; display:flex; flex-wrap:wrap; gap:.7rem; align-items:center; }
 .panel input[type=range] { width:min(380px,50vw); accent-color:var(--keep); }
 .panel output { font-variant-numeric:tabular-nums; font-weight:600; min-width:2.2rem; }
 .curve { display:flex; gap:2px; width:100%; margin-top:.5rem; flex-wrap:wrap; }
 .tick { flex:1; min-width:34px; text-align:center; font-size:.65rem; color:var(--mut);
         text-decoration:none; border:1px solid var(--line); border-radius:3px;
         padding:.15rem 0; }
 .tick b { display:block; color:var(--fg); font-size:.8rem; }
 .tick:hover { border-color:var(--mut); }
 .tick.on { border-color:var(--keep); color:var(--keep); }
 .tick.on b { color:var(--keep); }
</style></head>
<body>
<header>
  <a href="/">Gerry</a>
  <nav>
    <a href="/shoots">Shoots</a>
    <a href="/costs">Costs</a>
    <a href="/healthz">Health</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body></html>
